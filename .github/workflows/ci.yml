name: ci

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Only 'staging' or 'hotfix/*' may be merged into master
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" = "master" ]; then
            case "$HEAD_REF" in
              staging|hotfix/*) echo "OK: $HEAD_REF -> master" ;;
              *) echo "::error::PRs into master must come from 'staging' or 'hotfix/*' (got '$HEAD_REF')"; exit 1 ;;
            esac
          else
            echo "OK: $HEAD_REF -> $BASE_REF"
          fi

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Docker build (no push)
        run: docker build -t crud-app:ci-${{ github.sha }} .
